services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      DATABASE_URL: file:/data/smart-ac.sqlite
      API_SECRET: ${API_SECRET:-dev-secret-change-me}
      TRANSPORT: ${TRANSPORT:-mock}
      MQTT_HOST: mosquitto
      MQTT_PORT: '1883'
      MQTT_USERNAME: smartac
      MQTT_PASSWORD: smartac
      DEVICE_ID: ac-controller
    volumes:
      - backend-data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    build:
      context: .
      dockerfile: mosquitto.Dockerfile
    ports:
      - '127.0.0.1:1883:1883'
    restart: unless-stopped

volumes:
  backend-data:
